; ZxCMC theme configuration (optional file)
; Lines are Key=Value. Any line not matching a known key is ignored.
;
; Auto: 1 = (default) follow the Windows dark/light app mode automatically
;       (reads HKCU\...\Themes\Personalize\AppsUseLightTheme).
;       0 = use the fixed colors below (dark preset is built in).
Auto=1
;
; Explicit colors override the chosen preset (hex RRGGBB, no #).
; Background: window and list background
; Control:   control surfaces (reserved)
; Text:      text color
; Transparency: 0-255 window opacity (255 = opaque)
;
; Built-in presets used when a key is not set:
;   Dark  (default / Auto set when windows is set to Dark): Background=1E1E1E Control=3A3A3A Text=FFFFFF Hint=9E9E9E Transparency=255
;   Light (Auto set when windows is set to Light):  Background=F3F3F3 Control=EDEDED Text=1A1A1A Hint=595959 Transparency=255
; 
; Default Dark theme (uncomment to use):
;Background=1E1E1E
;Control=3A3A3A
;Text=FFFFFF
;Hint=9E9E9E
;Transparency=255
;
; Default Light theme (uncomment to use):
;Background=F3F3F3 
;Control=EDEDED 
;Text=1A1A1A 
;Hint=595959 
;Transparency=255